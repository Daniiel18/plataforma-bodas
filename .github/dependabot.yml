version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next-and-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      supabase:
        patterns: ["@supabase/*"]
      tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Tracks the Node.js runtime in .nvmrc; bumped by hand together with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major TypeScript releases wait until Next.js supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
