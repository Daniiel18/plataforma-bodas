version: 2
updates:
  # One pull request a month with every minor and patch update, and security
  # fixes grouped together as soon as they are published.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Tracks the Node.js runtime in .nvmrc; bumped by hand together with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major TypeScript releases wait until Next.js supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
