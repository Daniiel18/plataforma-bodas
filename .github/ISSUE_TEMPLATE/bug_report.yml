name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Please do not include personal data of real guests.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Guest invitation
        - RSVP / wishes
        - Couple's dashboard
        - Notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce and what you expected instead.
      placeholder: |
        1. Open /demo on an iPhone
        2. Tap "Abrir"
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18 / Pixel 8, Chrome 130
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
